                title: 'System Monitor',
                size: { x: 180, y: 110, w: 480, h: 560 },
                icon: svg('M3 13h2v7H3v-7zm4-5h2v12H7V8zm4 3h2v9h-2v-9zm4-6h2v15h-2V5zm4 4h2v11h-2V9z'),
                render: (id) => `
                    <div class="monitor-container">
                        <div class="monitor-card">
                            <div class="monitor-head"><div class="monitor-label">CPU Usage</div><div class="monitor-value" id="${id}-cpu">0%</div></div>
                            <div class="monitor-bar"><div class="bar-fill" id="${id}-bar-cpu" style="width:0%"></div></div>
                            <canvas class="monitor-canvas" id="${id}-cpu-canvas"></canvas>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-head"><div class="monitor-label">Memory</div><div class="monitor-value" id="${id}-mem">0%</div></div>
                            <div class="monitor-bar"><div class="bar-fill" id="${id}-bar-mem" style="width:0%"></div></div>
                            <div class="monitor-sub" id="${id}-mem-detail">—</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-head"><div class="monitor-label">Virtual Disk</div><div class="monitor-value" id="${id}-disk">0%</div></div>
                            <div class="monitor-bar"><div class="bar-fill" id="${id}-bar-disk" style="width:0%"></div></div>
                            <div class="monitor-sub" id="${id}-disk-detail">—</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-head"><div class="monitor-label">Network</div><div class="monitor-value" id="${id}-net">0 KB/s</div></div>
                            <div class="monitor-bar"><div class="bar-fill" id="${id}-bar-net" style="width:0%"></div></div>
                            <div class="monitor-sub" id="${id}-net-detail">down 0 · up 0</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-head">
                                <div class="monitor-label">Processes</div>
                                <button class="btn btn-icon" id="${id}-procreset" title="Reset processes">${Icons.restart}</button>
                            </div>
                            <table class="proc-table">
                                <tr><th>Name</th><th>CPU</th><th>Mem</th><th></th></tr>
                                <tbody id="${id}-procs"></tbody>
                            </table>
                        </div>
                    </div>`,
                init: (win, id) => {
                    const cpuEl = win.querySelector('#' + id + '-cpu');
                    const cpuBar = win.querySelector('#' + id + '-bar-cpu');
                    const memEl = win.querySelector('#' + id + '-mem');
                    const memBar = win.querySelector('#' + id + '-bar-mem');
                    const memDetail = win.querySelector('#' + id + '-mem-detail');
                    const diskEl = win.querySelector('#' + id + '-disk');
                    const diskBar = win.querySelector('#' + id + '-bar-disk');
                    const diskDetail = win.querySelector('#' + id + '-disk-detail');
                    const netEl = win.querySelector('#' + id + '-net');
                    const netBar = win.querySelector('#' + id + '-bar-net');
                    const netDetail = win.querySelector('#' + id + '-net-detail');
                    const procBody = win.querySelector('#' + id + '-procs');
                    const canvas = win.querySelector('#' + id + '-cpu-canvas');
                    const ctx = canvas.getContext('2d');

                    const BASE_PROCS = [
                        ['droid-kernel', 2], ['window-manager', 3], ['vfs-service', 1],
                        ['terminal', 4], ['files', 2], ['editor', 3], ['settings', 1], ['system-monitor', 5]
                    ];
                    let procs = BASE_PROCS.map(([n, c]) => ({ name: n, cpu: c, mem: Math.round(Math.random() * 20 + 2), alive: true }));
                    const samples = new Array(40).fill(0);
                    let lastTick = performance.now();
                    let netDown = 0, netUp = 0;

                    const draw = () => {
                        const dpr = window.devicePixelRatio || 1;
                        canvas.width = canvas.offsetWidth * dpr;
                        canvas.height = canvas.offsetHeight * dpr;
                        ctx.scale(dpr, dpr);
                        const w = canvas.offsetWidth, h = canvas.offsetHeight;
                        ctx.clearRect(0, 0, w, h);
                        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim() || '#3b82f6';
                        ctx.beginPath();
                        ctx.moveTo(0, h);
                        samples.forEach((s, i) => { ctx.lineTo((i / (samples.length - 1)) * w, h - (s / 100) * (h - 4) - 2); });
                        ctx.lineTo(w, h);
                        ctx.closePath();
                        ctx.fillStyle = accent + '22';
                        ctx.fill();
                        ctx.beginPath();
                        samples.forEach((s, i) => {
                            const x = (i / (samples.length - 1)) * w, y = h - (s / 100) * (h - 4) - 2;
                            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        });
                        ctx.strokeStyle = accent;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    };

                    const renderProcs = () => {
                        procBody.innerHTML = '';
                        procs.filter(p => p.alive).forEach((p, i) => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = '<td class="proc-name">' + escapeHtml(p.name) + '</td>' +
                                '<td>' + p.cpu + '%</td><td>' + p.mem + ' MB</td>' +
                                '<td><button class="proc-kill" data-i="' + i + '">End</button></td>';
                            procBody.appendChild(tr);
                        });
                        procBody.querySelectorAll('.proc-kill').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const name = procs[btn.dataset.i].name;
                                procs[btn.dataset.i].alive = false;
                                renderProcs();
                                notify('System Monitor', 'Ended process ' + name, 'ok');
                            });
                        });
                    };

                    const tick = () => {
                        const now = performance.now();
                        const delta = now - lastTick;
                        lastTick = now;
                        const lag = Math.max(0, delta - 700);
                        const load = Math.min(100, Math.max(2, Math.round((lag / 700) * 100) + 4 + Math.random() * 6));
                        samples.push(load);
                        samples.shift();
                        cpuEl.textContent = load + '%';
                        cpuBar.style.width = load + '%';

                        let memPct = 30, memDetailText = 'estimating…';
                        if (performance.memory) {
                            const used = performance.memory.usedJSHeapSize;
                            const limit = performance.memory.jsHeapSizeLimit;
                            memPct = Math.round((used / limit) * 100);
                            memDetailText = formatBytes(used) + ' of ' + formatBytes(limit);
                        } else {
                            const total = navigator.deviceMemory || 8;
                            memPct = Math.min(90, Math.round(((navigator.deviceMemory ? 0.5 : 1) / total) * 100) + 10);
                            memDetailText = '≈ ' + total + ' GB installed';
                        }
                        memEl.textContent = memPct + '%';
                        memBar.style.width = memPct + '%';
                        memDetail.textContent = memDetailText;

                        const used = VFS.size();
                        const diskPct = Math.min(100, Math.round((used / QUOTA) * 100));
                        diskEl.textContent = diskPct + '%';
                        diskBar.style.width = diskPct + '%';
                        diskDetail.textContent = formatBytes(used) + ' of 5 MB';

                        netDown += Math.random() * 1.2;
                        netUp += Math.random() * 0.4;
                        const rate = (Math.random() * 900 + 80).toFixed(0);
                        netEl.textContent = rate + ' KB/s';
                        netBar.style.width = Math.min(100, rate / 12) + '%';
                        netDetail.textContent = 'down ' + formatBytes(Math.round(netDown * 100000)) + ' · up ' + formatBytes(Math.round(netUp * 100000));

                        procs.forEach(p => { if (p.alive) p.cpu = Math.max(0, Math.min(98, Math.round(p.cpu + (Math.random() * 6 - 3)))); });
                        renderProcs();
                        draw();
                    };

                    win.querySelector('#' + id + '-procreset').addEventListener('click', () => {
                        procs = BASE_PROCS.map(([n, c]) => ({ name: n, cpu: c, mem: Math.round(Math.random() * 20 + 2), alive: true }));
                        renderProcs();
                    });

                    const iv = setInterval(tick, 700);
                    tick();
                    win._stopMonitor = () => clearInterval(iv);
                }
            },

            // ----------------------------------------------------------
            'viewer': {
                title: 'Image Viewer',
                size: { x: 200, y: 120, w: 520, h: 420 },
                icon: Icons.pictures,
                render: (id) => `
                    <div class="viewer-container">
                        <div class="viewer-stage" id="${id}-stage"></div>
                        <div class="viewer-bar" id="${id}-bar"></div>
                    </div>`,
                init: (win, id) => {
                    const stage = win.querySelector('#' + id + '-stage');
                    const bar = win.querySelector('#' + id + '-bar');
                    const opts = takeAppOpts('viewer');
                    const path = opts && opts.path;
                    const node = path ? VFS.get_node(path) : null;
                    if (!node) { stage.innerHTML = '<div class="viewer-placeholder"><div>No image loaded</div></div>'; return; }
                    const name = baseName(path);
                    const content = String(node.content || '');
                    const dot = name.lastIndexOf('.');
                    const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
                    const isSvg = ext === 'svg' || content.trim().startsWith('<svg');
                    bar.textContent = name + ' · ' + formatBytes(content.length) + ' · ' + (isSvg ? 'SVG vector' : 'Raster (simulated)');
                    if (isSvg) {
                        // Render SVGs through an inert <img> data-URL so file content can never execute as HTML
                        const safe = content.replace(/<script[\s\S]*?<\/script>/gi, '');
                        const img = document.createElement('img');
                        img.alt = name;
                        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(safe);
                        stage.appendChild(img);
                    } else {
                        stage.innerHTML = '<div class="viewer-placeholder">' + Icons.pictures +
                            '<div class="name">' + escapeHtml(name) + '</div><div>No preview available for this simulated image</div></div>';
                    }
                }
            },

            // ----------------------------------------------------------
            'about': {
                title: 'About Droid',
                size: { x: 220, y: 130, w: 480, h: 520 },
                icon: Icons.droid,
                render: (id) => `
                    <div class="about-container">
                        <svg class="about-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l9 1.71L21 3.71L12 2z"/></svg>
                        <div class="about-name">Droid OS</div>
                        <div class="about-version">v${CONFIG.VERSION} · ${CONFIG.KERNEL}</div>
                        <div class="about-tagline">An operating system dreamt up and built by Droid — an autonomous coding agent from Factory AI. Dark, precise, electric blue.</div>
                        <div class="about-section">
                            <h3>System</h3>
                            <div class="dialog-row"><span class="k">User</span><span class="v">${CONFIG.USER}</span></div>
                            <div class="dialog-row"><span class="k">Host</span><span class="v">${CONFIG.HOST}</span></div>
                            <div class="dialog-row"><span class="k">Uptime</span><span class="v" id="${id}-uptime"></span></div>
                            <div class="dialog-row"><span class="k">Memory</span><span class="v">${memoryInfo()}</span></div>
                            <div class="dialog-row"><span class="k">Resolution</span><span class="v">${window.innerWidth}×${window.innerHeight}</span></div>
                            <div class="dialog-row"><span class="k">Engine</span><span class="v">single-file</span></div>
                            <div class="dialog-row"><span class="k">Storage used</span><span class="v">${formatBytes(VFS.size())}</span></div>
                        </div>
                        <div class="about-section">
                            <h3>Credits</h3>
                            <div class="dialog-row"><span class="k">Designed &amp; built by</span><span class="v">Droid · Factory AI</span></div>
                            <div class="dialog-row"><span class="k">Everything</span><span class="v">one HTML file</span></div>
                        </div>
                        <div class="about-actions">
                            <button class="btn" id="${id}-settings">Open Settings</button>
                            <button class="btn btn-primary" id="${id}-monitor">System Monitor</button>
                        </div>
                    </div>`,
                init: (win, id) => {
                    const uptimeEl = win.querySelector('#' + id + '-uptime');
                    const iv = setInterval(() => { uptimeEl.textContent = formatUptime(); }, 1000);
                    win._stopMonitor = () => clearInterval(iv);
                    win.querySelector('#' + id + '-settings').addEventListener('click', () => launchApp('settings'));
                    win.querySelector('#' + id + '-monitor').addEventListener('click', () => launchApp('system-monitor'));
                }
            }
        };

        // ============================================================
        // 12. Launcher
        // ============================================================
        function launcherOpen() {
            return document.getElementById('launcher').style.display === 'flex';
        }

        function toggleLauncher() {
            const launcher = document.getElementById('launcher');
            const open = launcherOpen();
            launcher.style.display = open ? 'none' : 'flex';
            if (!open) {
                document.querySelector('.launcher-search').focus();
                renderLauncherRecents();
            }
        }

        function closeLauncher() {
            document.getElementById('launcher').style.display = 'none';
        }

        function renderLauncherRecents() {
            const wrap = document.getElementById('launcher-recents');
            const grid = document.getElementById('launcher-recents-grid');
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('droid_os_recent') || '[]'); } catch (e) {}
            const valid = recents.filter(k => AppRegistry[k]);
            if (valid.length === 0) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            grid.innerHTML = '';
            valid.forEach(key => {
                const app = AppRegistry[key];
                const el = document.createElement('div');
                el.className = 'launcher-app-item';
                el.tabIndex = 0;
                el.innerHTML = app.icon + '<span>' + app.title + '</span>';
                el.addEventListener('click', () => { launchApp(key); closeLauncher(); });
                grid.appendChild(el);
            });
        }

        function shutdown() {
            closeLauncher();
            const off = document.getElementById('power-off');
            off.classList.remove('hidden');
            off.addEventListener('click', () => location.reload(), { once: true });
        }

        // ============================================================
        // 13. Desktop & launcher rendering
        // ============================================================
        function buildDesktopIcons() {
            const container = document.getElementById('desktop-icons');
            container.innerHTML = '';
            Object.keys(AppRegistry).forEach(key => addDesktopIcon(key, AppRegistry[key].title, AppRegistry[key].icon, () => launchApp(key)));
            addDesktopIcon('trash', 'Trash', Icons.trash, () => launchApp('files', { path: TRASH_PATH }), 'icon-trash');
        }

        function addDesktopIcon(key, title, icon, onOpen, iconCls) {
            const container = document.getElementById('desktop-icons');
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.dataset.appKey = key;
            el.innerHTML = '<div class="' + (iconCls || '') + '">' + icon + '</div><span>' + title + '</span>';
            el.addEventListener('click', () => {
                document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
                el.classList.add('selected');
            });
            el.addEventListener('dblclick', () => { onOpen(); el.classList.remove('selected'); });
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                el.classList.add('selected');
                const items = [{ label: 'Open', icon: Icons.droid, action: onOpen }];
                if (key === 'trash') {
                    items.push({ label: 'Empty Trash', icon: Icons.trash, action: () => {
                        const n = VFS.emptyTrash();
                        notify('Trash', n + ' item' + (n === 1 ? '' : 's') + ' emptied', n ? 'ok' : 'warn');
                    }});
                }
                showContextMenu(items, e.clientX, e.clientY);
            });
            container.appendChild(el);
        }

        function buildLauncher() {
            const grid = document.getElementById('launcher-apps-grid');
            grid.innerHTML = '';
            Object.keys(AppRegistry).forEach(key => {
                const app = AppRegistry[key];
                const el = document.createElement('div');
                el.className = 'launcher-app-item';
                el.tabIndex = 0;
                el.dataset.appKey = key;
                el.innerHTML = app.icon + '<span>' + app.title + '</span>';
                el.addEventListener('click', (e) => { launchApp(key); closeLauncher(); e.stopPropagation(); });
                grid.appendChild(el);
            });
            renderLauncherRecents();
        }

        function setupLauncher() {
            const search = document.querySelector('.launcher-search');
            search.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll('#launcher-apps-grid .launcher-app-item, #launcher-recents-grid .launcher-app-item').forEach(el => {
                    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            });

            document.getElementById('start-button').addEventListener('click', (e) => {
                toggleLauncher();
                e.stopPropagation();
            });
            document.getElementById('launcher-settings').addEventListener('click', () => { launchApp('settings'); closeLauncher(); });
            document.getElementById('launcher-restart').addEventListener('click', () => location.reload());
            document.getElementById('launcher-shutdown').addEventListener('click', shutdown);

            document.body.addEventListener('click', () => {
                if (launcherOpen()) closeLauncher();
            });
            document.getElementById('launcher').addEventListener('click', (e) => e.stopPropagation());

            // Keyboard navigation inside the launcher
            document.getElementById('launcher').addEventListener('keydown', (e) => {
                const items = Array.from(document.querySelectorAll('#launcher-apps-grid .launcher-app-item, #launcher-recents-grid .launcher-app-item'))
                    .filter(el => el.style.display !== 'none');
                if (items.length === 0) return;
                let idx = items.indexOf(document.activeElement);
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    idx = (idx + 1) % items.length;
                    items[idx].focus();
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    idx = (idx - 1 + items.length) % items.length;
                    items[idx].focus();
                } else if (e.key === 'Enter' && idx >= 0) {
                    e.preventDefault();
                    items[idx].click();
                }
            });
        }

        // ============================================================
        // 14. Desktop interactions & global shortcuts
        // ============================================================
        function setupDesktop() {
            document.getElementById('desktop').addEventListener('contextmenu', (e) => {
                if (e.target.closest('.desktop-icon') || e.target.closest('#taskbar') || e.target.closest('.window')) return;
                e.preventDefault();
                showContextMenu([
                    { label: 'New Folder', icon: Icons.folder, action: () => {
                        const name = prompt('Folder name:');
                        if (name) { VFS.mkdir('/Desktop/' + name.trim()); notify('Desktop', 'Folder created on Desktop', 'ok'); }
                    }},
                    { label: 'New File', icon: Icons.file, action: () => {
                        const name = prompt('File name (include extension):');
                        if (name) { VFS.touch('/Desktop/' + name.trim()); notify('Desktop', 'File created on Desktop', 'ok'); }
                    }},
                    { sep: true },
                    { label: 'Refresh', icon: Icons.restart, action: () => buildDesktopIcons() },
                    { label: 'Display Settings', icon: Icons.settings, action: () => launchApp('settings') },
                    { sep: true },
                    { label: 'Open Terminal', icon: svg('M20 3H4v18h16V3zM8 17H6v-2h2v2zm-2-4H6v-2h2v2zm4 4H8v-2h2v2zm4-4h-2v-2h2v2zm4 4h-2v-2h2v2z'), action: () => launchApp('terminal') }
                ], e.clientX, e.clientY);
            });

            document.getElementById('desktop').addEventListener('mousedown', (e) => {
                if (e.target.id === 'desktop') {
                    document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
                }
            });

            // Global keyboard shortcuts
            window.addEventListener('keydown', (e) => {
                const mod = e.metaKey || e.ctrlKey;
                const active = WindowManager.getActive();
                const inField = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

                if (mod && e.key === ' ') { e.preventDefault(); toggleLauncher(); return; }
                if (mod && e.shiftKey && e.key === 'Escape') { e.preventDefault(); launchApp('system-monitor'); return; }
                if (mod && e.key.toLowerCase() === 's') {
                    if (active && active._saveHandler) { e.preventDefault(); active._saveHandler(); return; }
                }
                if (mod && e.key.toLowerCase() === 'f') {
                    if (active && active._fileOps && !inField) { e.preventDefault(); active._fileOps.focusSearch(); return; }
                }
                if (mod && e.key.toLowerCase() === 'a') {
                    if (active && active._fileOps && !inField) { e.preventDefault(); active._fileOps.selectAll(); return; }
                }
                if (mod && ['c', 'x', 'v'].includes(e.key.toLowerCase())) {
                    if (active && active._fileOps && !inField) {
                        e.preventDefault();
                        const k = e.key.toLowerCase();
                        if (k === 'c') active._fileOps.copy();
                        else if (k === 'x') active._fileOps.cut();
                        else active._fileOps.paste();
                        return;
                    }
                }
                if ((e.key === 'Delete' || e.key === 'Backspace') && active && active._fileOps && !inField) {
                    e.preventDefault();
                    active._fileOps.deleteSelection();
                    return;
                }
                if (e.key === 'Escape') {
                    hideContextMenu();
                    if (launcherOpen()) closeLauncher();
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (!e.target.closest('.context-menu')) hideContextMenu();
            });
        }

        // ============================================================
        // 15. Clock
        // ============================================================
        function updateClock() {
            const now = new Date();
            const prefs = loadPrefs();
            const opts = { hour: '2-digit', minute: '2-digit' };
            if (prefs.showSeconds) opts.second = '2-digit';
            const t = document.getElementById('tray-time');
            if (t) t.textContent = now.toLocaleTimeString([], opts);
            const d = document.getElementById('tray-date');
            if (d) d.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // ============================================================
        // 16. Boot
        // ============================================================
        function applySavedSettings() {
            applyTheme(localStorage.getItem('droid_os_theme') || 'dark');
            applyWallpaper(localStorage.getItem('droid_os_wallpaper') || 'grid');
            const accent = localStorage.getItem('droid_os_accent');
            if (accent) setAccent(accent);
            applyPrefs(loadPrefs());
        }

        function bootstrap() {
            applySavedSettings();
            buildDesktopIcons();
            buildLauncher();
            setupLauncher();
            setupDesktop();
            updateClock();
            setInterval(updateClock, 1000);
            runBootSplash();
        }

        function runBootSplash() {
            const splash = document.getElementById('boot-splash');
            const bar = document.getElementById('boot-bar');
            const sub = splash.querySelector('.boot-sub');
            const msgs = [
                'Mounting virtual filesystem…',
                'Starting window manager…',
                'Loading applications…',
                'All systems nominal'
            ];
            let p = 0;
            const iv = setInterval(() => {
                p += Math.random() * 16 + 8;
                if (p >= 100) {
                    p = 100;
                    clearInterval(iv);
                    bar.style.width = '100%';
                    sub.textContent = msgs[3];
                    setTimeout(() => {
                        splash.classList.add('hidden');
                        setTimeout(() => splash.remove(), 600);
                        notify('Welcome to Droid OS', 'All systems operational. Double-click an icon to get started.', 'ok');
                    }, 400);
                } else {
                    bar.style.width = p + '%';
                    sub.textContent = msgs[Math.min(msgs.length - 1, Math.floor(p / 100 * msgs.length))];
                }
            }, 110);
        }

        window.addEventListener('load', bootstrap);
    </script>
</body>
</html>
