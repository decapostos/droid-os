<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droid OS</title>
    <style>
        :root {
            /* Droid OS Color Palette - Dark/Technical Theme */
            --bg-color: #0a0b10;
            --surface-color: rgba(30, 34, 42, 0.7);
            --surface-color-elevated: rgba(45, 50, 65, 0.92);
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #3b82f6; /* Electric Blue */
            --accent-color-dim: rgba(59, 130, 246, 0.3);
            --border-color: rgba(255, 255, 255, 0.1);
            --error-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;

            /* Component-level surfaces (themeable) */
            --app-bg: #0d0f16;
            --term-bg: #050608;
            --header-bg: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(0, 0, 0, 0.25);
            --track-color: rgba(255, 255, 255, 0.08);
            --taskbar-bg: rgba(10, 11, 16, 0.85);
            --hover-bg: rgba(255, 255, 255, 0.08);
            --sidebar-bg: rgba(0, 0, 0, 0.2);

            /* Typography */
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;

            /* Spacing & Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;

            /* Shadows & Blurs */
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.5);
            --glass-blur: blur(12px);
        }

        [data-theme="light"] {
            --bg-color: #e8ebf2;
            --surface-color: rgba(255, 255, 255, 0.78);
            --surface-color-elevated: rgba(255, 255, 255, 0.94);
            --text-primary: #1a1f2e;
            --text-secondary: #5b6478;
            --border-color: rgba(20, 25, 40, 0.12);
            --app-bg: #eef1f6;
            --header-bg: rgba(0, 0, 0, 0.05);
            --input-bg: rgba(20, 25, 40, 0.07);
            --track-color: rgba(20, 25, 40, 0.12);
            --taskbar-bg: rgba(238, 241, 247, 0.9);
            --hover-bg: rgba(20, 25, 40, 0.08);
            --sidebar-bg: rgba(20, 25, 40, 0.04);
            --shadow-md: 0 10px 25px rgba(30, 40, 70, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-ui);
            color: var(--text-primary);
            color-scheme: dark;
        }
        [data-theme="light"] { color-scheme: light; }

        input, textarea { user-select: text; }

        .reduce-motion * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }

        /* --- Desktop & Wallpapers --- */
        #desktop {
            position: relative; width: 100%; height: 100%;
            background-color: #0a0b10;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        #desktop[data-wallpaper="grid"] {
            background-image:
                radial-gradient(circle at 50% 40%, #1a1c2c 0%, #0a0b10 100%),
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
        }
        #desktop[data-wallpaper="wave"] {
            background-image:
                radial-gradient(60% 50% at 20% 90%, rgba(59, 130, 246, 0.28), transparent 60%),
                radial-gradient(50% 40% at 85% 20%, rgba(59, 130, 246, 0.18), transparent 60%),
                linear-gradient(160deg, #141b33 0%, #1a1c2c 55%, #0d1117 100%);
        }
        #desktop[data-wallpaper="midnight"] {
            background-image: radial-gradient(120% 90% at 50% 110%, #10131d 0%, #07080c 70%);
        }
        #desktop[data-wallpaper="dusk"] {
            background-image:
                radial-gradient(70% 60% at 50% 110%, rgba(168, 85, 247, 0.22), transparent 65%),
                linear-gradient(180deg, #1b1333 0%, #141b33 55%, #0a0b10 100%);
        }
        [data-theme="light"] #desktop[data-wallpaper="grid"] {
            background-image:
                radial-gradient(circle at 50% 40%, #e3e8f3 0%, #e8ebf2 100%),
                linear-gradient(rgba(59, 130, 246, 0.10) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.10) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
        }
        [data-theme="light"] #desktop[data-wallpaper="wave"] {
            background-image:
                radial-gradient(60% 50% at 20% 90%, rgba(59, 130, 246, 0.30), transparent 60%),
                radial-gradient(50% 40% at 85% 20%, rgba(59, 130, 246, 0.20), transparent 60%),
                linear-gradient(160deg, #dbe3f2 0%, #e8ebf2 55%, #f0f2f7 100%);
        }
        [data-theme="light"] #desktop[data-wallpaper="midnight"] {
            background-image: radial-gradient(120% 90% at 50% 110%, #e2e6ef 0%, #eef1f6 70%);
        }
        [data-theme="light"] #desktop[data-wallpaper="dusk"] {
            background-image:
                radial-gradient(70% 60% at 50% 110%, rgba(168, 85, 247, 0.22), transparent 65%),
                linear-gradient(180deg, #e4dcf1 0%, #e6eaf3 55%, #f0f2f7 100%);
        }

        /* --- Desktop Icons --- */
        #desktop-icons {
            position: absolute; top: var(--spacing-md); left: var(--spacing-md);
            display: flex; flex-direction: column; gap: var(--spacing-sm); z-index: 1;
        }
        .desktop-icon {
            width: 84px; height: 88px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s; text-align: center;
        }
        .desktop-icon:hover { background: var(--hover-bg); }
        .desktop-icon.selected { background: var(--accent-color-dim); border-color: var(--accent-color); }
        .desktop-icon svg { width: 40px; height: 40px; margin-bottom: var(--spacing-xs); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); color: var(--accent-color); }
        .desktop-icon .icon-trash { color: #8b949e; }
        .desktop-icon span { font-size: 12px; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        [data-theme="light"] .desktop-icon span { text-shadow: 0 1px 2px rgba(255,255,255,0.7); }

        /* --- Taskbar --- */
        #taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 48px;
            background: var(--taskbar-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 var(--spacing-md); z-index: 10000;
        }
        .taskbar-section { display: flex; align-items: center; gap: var(--spacing-md); height: 100%; }
        .taskbar-item {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            cursor: pointer; transition: transform 0.1s, background 0.2s;
        }
        .taskbar-item:hover { background: var(--hover-bg); transform: translateY(-2px); }
        #start-button { color: var(--accent-color); }
        .taskbar-divider { width: 1px; height: 24px; background: var(--border-color); margin: 0 var(--spacing-sm); }

        #running-apps { display: flex; align-items: center; gap: 6px; max-width: 52vw; overflow-x: auto; scrollbar-width: none; }
        #running-apps::-webkit-scrollbar { display: none; }
        .taskbar-app {
            display: flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: var(--radius-sm); background: var(--surface-color);
            border: 1px solid transparent; cursor: pointer; font-size: 12px;
            color: var(--text-secondary); height: 34px; white-space: nowrap;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .taskbar-app:hover { background: var(--hover-bg); color: var(--text-primary); }
        .taskbar-app.active { background: var(--accent-color-dim); border-color: var(--accent-color); color: var(--text-primary); }
        .taskbar-app svg { width: 16px; height: 16px; color: var(--accent-color); flex-shrink: 0; }

        #system-tray {
            display: flex; align-items: center; gap: var(--spacing-md);
            font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
        }
        .tray-icon { width: 16px; height: 16px; color: var(--text-secondary); }
        #tray-date { display: none; }
        @media (min-width: 760px) { #tray-date { display: inline; } }

        /* --- Windows --- */
        #window-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .window {
            position: absolute; min-width: 300px; min-height: 200px;
            background: var(--surface-color-elevated);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-md);
            pointer-events: auto; overflow: hidden;
            transition: border-color 0.2s;
            animation: winIn 0.18s ease-out;
        }
        @keyframes winIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
        .window.active { border-color: var(--accent-color); }
        .window:not(.active) .window-title { opacity: 0.7; }
        .window-header {
            height: 36px; background: var(--header-bg);
            display: flex; align-items: center; padding: 0 var(--spacing-sm);
            cursor: move; justify-content: space-between; flex-shrink: 0;
        }
        .window-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; transition: opacity 0.2s; }
        .window-controls { display: flex; gap: 8px; }
        .window-control {
            width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
            border: none; padding: 0; transition: filter 0.15s, transform 0.15s;
            display: flex; align-items: center; justify-content: center;
        }
        .window-control svg { width: 8px; height: 8px; }
        .window-control:hover { filter: brightness(1.3); transform: scale(1.15); }
        .control-close { background: #ff5f56; }
        .control-min { background: #ffbd2e; }
        .control-max { background: #27c93f; }
        .window-content { flex: 1; position: relative; overflow: hidden; }
        .app-content { height: 100%; padding: 0; }
        .resize-handle { position: absolute; bottom: 0; right: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 3; }
        .resize-handle::after {
            content: ''; position: absolute; right: 3px; bottom: 3px;
            width: 8px; height: 8px;
            border-right: 2px solid rgba(255,255,255,0.25);
            border-bottom: 2px solid rgba(255,255,255,0.25);
            border-radius: 0 0 4px 0;
        }

        /* --- Buttons --- */
        .btn {
            background: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-primary); border-radius: var(--radius-sm);
            padding: 6px 12px; font-size: 12px; font-family: var(--font-ui);
            cursor: pointer; transition: background 0.15s, transform 0.1s, filter 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn:hover { background: var(--surface-color-elevated); }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent-color); border-color: transparent; color: #fff; }
        .btn-primary:hover { background: var(--accent-color); filter: brightness(1.15); }
        .btn-icon { padding: 6px 8px; }
        .btn:disabled { opacity: 0.4; pointer-events: none; }

        /* --- Launcher --- */
        #launcher {
            position: absolute; bottom: 56px; left: 12px;
            width: 420px; max-height: calc(100% - 72px); height: 540px;
            background: var(--surface-color-elevated);
            backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-lg); border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            display: none; flex-direction: column; overflow: hidden;
            z-index: 10001; animation: launcherIn 0.15s ease-out;
        }
        @keyframes launcherIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .launcher-header {
            padding: var(--spacing-md); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .launcher-user { display: flex; align-items: center; gap: 10px; }
        .launcher-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #60a5fa);
            color: #fff; font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .launcher-name { font-size: 14px; font-weight: 600; }
        .launcher-status { font-size: 11px; color: var(--success-color); }
        .launcher-brand { font-size: 12px; font-weight: 700; letter-spacing: 0.25em; color: var(--accent-color); }
        .launcher-search-row { padding: var(--spacing-md) var(--spacing-md) 0; position: relative; }
        .launcher-search-row svg { position: absolute; left: 24px; top: 50%; transform: translateY(-52%); width: 15px; height: 15px; color: var(--text-secondary); pointer-events: none; }
        .launcher-search {
            width: 100%; padding: 8px 12px 8px 34px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary);
            outline: none; font-size: 13px;
        }
        .launcher-search:focus { border-color: var(--accent-color); }
        .launcher-recents { padding: 12px var(--spacing-md) 0; }
        .launcher-recents-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-secondary); opacity: 0.8; margin-bottom: 6px; }
        .launcher-recents-grid { display: flex; gap: 8px; }
        .launcher-apps { flex: 1; padding: 12px var(--spacing-md); display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-sm); overflow-y: auto; }
        .launcher-app-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; font-size: 12px; padding: 10px 4px; border-radius: var(--radius-md);
            border: 1px solid transparent; transition: background 0.15s, transform 0.1s, border-color 0.15s;
        }
        .launcher-app-item:hover, .launcher-app-item:focus { background: var(--accent-color-dim); transform: translateY(-2px); outline: none; border-color: var(--accent-color); }
        .launcher-app-item svg { width: 32px; height: 32px; color: var(--accent-color); }
        .launcher-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px var(--spacing-md); border-top: 1px solid var(--border-color);
        }
        .launcher-powers { display: flex; gap: 6px; }
        .launcher-powers .btn { color: var(--text-secondary); }
        .launcher-powers .btn:hover { color: var(--text-primary); }
        #launcher-shutdown:hover { color: var(--error-color); border-color: var(--error-color); }

        /* --- Context Menu --- */
        .context-menu {
            position: fixed; z-index: 20000; min-width: 190px;
            background: var(--surface-color-elevated);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 5px;
            box-shadow: var(--shadow-md);
            animation: menuIn 0.12s ease-out;
        }
        @keyframes menuIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
        .context-item {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 10px; border-radius: var(--radius-sm);
            font-size: 13px; cursor: pointer; color: var(--text-primary);
        }
        .context-item:hover { background: var(--accent-color-dim); }
        .context-item.disabled { opacity: 0.4; pointer-events: none; }
        .context-item svg { width: 16px; height: 16px; color: var(--accent-color); flex-shrink: 0; }
        .context-sep { height: 1px; background: var(--border-color); margin: 5px 6px; }

        /* --- Notifications --- */
        #notification-center {
            position: absolute; top: 12px; right: 12px; width: 320px; max-height: 600px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10002; pointer-events: none;
        }
        .notification {
            background: var(--surface-color-elevated); backdrop-filter: var(--glass-blur);
            border-left: 4px solid var(--accent-color);
            border-radius: var(--radius-sm); padding: 12px; box-shadow: var(--shadow-md);
            animation: slideIn 0.3s ease-out forwards;
            pointer-events: auto; transition: opacity 0.3s, transform 0.3s;
            display: flex; gap: 10px;
        }
        .notification svg { width: 18px; height: 18px; color: var(--accent-color); flex-shrink: 0; margin-top: 1px; }
        .notification.ok { border-left-color: var(--success-color); }
        .notification.ok svg { color: var(--success-color); }
        .notification.warn { border-left-color: var(--warning-color); }
        .notification.warn svg { color: var(--warning-color); }
        .notification.err { border-left-color: var(--error-color); }
        .notification.err svg { color: var(--error-color); }
        .notification.removing { opacity: 0; transform: translateX(100%); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .notification-main { flex: 1; min-width: 0; }
        .notification-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .notification-title { font-size: 13px; font-weight: 700; }
        .notification-body { font-size: 12px; color: var(--text-secondary); }
        .notification-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; }
        .notification-close:hover { color: var(--text-primary); }

        /* --- Terminal --- */
        .terminal-container { background: var(--term-bg); color: #e6edf3; font-family: var(--font-mono); font-size: 13px; height: 100%; display: flex; flex-direction: column; }
        .terminal-output { flex: 1; padding: 8px; white-space: pre-wrap; overflow-y: auto; line-height: 1.5; }
        .terminal-output .line { display: block; }
        .term-ok { color: #7ee787; }
        .term-err { color: #ff6b6b; }
        .term-dim { color: #8b949e; }
        .term-title { color: #58a6ff; font-weight: 600; }
        .term-ascii { color: var(--accent-color); white-space: pre; }
        .terminal-input-line { display: flex; padding: 4px 8px; border-top: 1px solid rgba(255,255,255,0.06); }
        .terminal-prompt { color: var(--accent-color); margin-right: 8px; white-space: nowrap; }
        .terminal-input { background: transparent; border: none; color: inherit; outline: none; flex: 1; font-family: var(--font-mono); caret-color: var(--accent-color); }

        /* --- Files --- */
        .files-container { display: flex; flex-direction: column; height: 100%; background: var(--app-bg); }
        .files-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; flex-wrap: wrap; }
        .files-crumbs { flex: 1; display: flex; align-items: center; gap: 2px; min-width: 120px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 5px 8px; overflow: hidden; }
        .crumb { font-size: 12px; color: var(--text-secondary); padding: 1px 5px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
        .crumb:hover { background: var(--hover-bg); color: var(--text-primary); }
        .crumb:last-child { color: var(--accent-color); font-weight: 600; cursor: default; }
        .crumb-sep { color: var(--text-secondary); opacity: 0.5; font-size: 10px; }
        .files-search { width: 120px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); padding: 6px 8px; font-size: 12px; outline: none; }
        .files-search:focus { border-color: var(--accent-color); width: 150px; transition: width 0.2s; }
        .files-body { flex: 1; display: flex; overflow: hidden; }
        .files-sidebar { width: 150px; border-right: 1px solid var(--border-color); padding: 8px; overflow-y: auto; background: var(--sidebar-bg); flex-shrink: 0; }
        .files-side-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); opacity: 0.7; padding: 4px 8px 6px; }
        .files-side-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: background 0.15s, color 0.15s; }
        .files-side-item:hover { background: var(--hover-bg); color: var(--text-primary); }
        .files-side-item.active { background: var(--accent-color-dim); color: var(--text-primary); }
        .files-side-item svg { width: 15px; height: 15px; color: var(--accent-color); flex-shrink: 0; }
        .files-main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .files-main { flex: 1; overflow-y: auto; padding: 8px; }
        .file-item {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 10px; border-radius: 6px; cursor: pointer;
            border: 1px solid transparent; transition: background 0.12s, border-color 0.12s, opacity 0.15s;
        }
        .file-item:hover { background: var(--hover-bg); }
        .file-item.selected { background: var(--accent-color-dim); border-color: var(--accent-color); }
        .file-item.cut { opacity: 0.45; }
        .file-item svg { width: 22px; height: 22px; flex-shrink: 0; }
        .file-item .icon-folder { color: #fbbf24; }
        .file-item .icon-txt { color: var(--accent-color); }
        .file-item .icon-img { color: #34d399; }
        .file-item .icon-arc { color: #fbbf24; }
        .file-item .icon-mus { color: #c084fc; }
        .file-item .icon-vid { color: #f87171; }
        .file-item .icon-app { color: #22d3ee; }
        .file-item .icon-file { color: var(--text-secondary); }
        .file-item .icon-trash { color: var(--text-secondary); }
        .file-item .file-meta { margin-left: auto; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); flex-shrink: 0; }
        .file-item .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

            constructor() {
                this.root = this._defaultTree();
                this.load();
                this.ensureDefaults();
            }

            load() {
                const stored = localStorage.getItem('droid_os_vfs');
                if (stored) {
                    try { this.root = JSON.parse(stored); } catch (e) { console.error('Failed to load VFS', e); }
                }
            }

            save() {
                try { localStorage.setItem('droid_os_vfs', JSON.stringify(this.root)); }
                catch (e) { console.error('Failed to save VFS', e); }
            }

            // Merge any default folders/files that are missing (keeps user data intact)
            ensureDefaults() {
                const defaults = this._defaultTree();
                const merge = (target, src) => {
                    if (!src.children) return;
                    if (!target.children) target.children = {};
                    Object.keys(src.children).forEach(k => {
                        const s = src.children[k];
                        if (!(k in target.children)) {
                            target.children[k] = JSON.parse(JSON.stringify(s));
                        } else if (s.type === 'directory' && target.children[k].type === 'directory') {
                            merge(target.children[k], s);
                        }
                    });
                };
                merge(this.root, defaults);
                this.save();
            }

            resolve(path) {
                if (!path || path === '/') return { parent: null, node: this.root, name: '/', exists: true };
                const parts = String(path).split('/').filter(p => p.length > 0);
                let node = this.root, parent = null, name = '/';
                for (let i = 0; i < parts.length; i++) {
                    parent = node; name = parts[i];
                    if (!parent.children || !(name in parent.children)) {
                        return { parent, node: null, name, exists: false };
                    }
                    node = parent.children[name];
                }
                return { parent, node, name, exists: true };
            }

            get_node(path) { return this.resolve(path).node; }
            exists(path) { return this.resolve(path).exists; }

            list(path) {
                const { node, exists } = this.resolve(path);
                if (!exists || node.type !== 'directory' || !node.children) return null;
                return Object.entries(node.children);
            }

            isDir(path) {
                const { node, exists } = this.resolve(path);
                return exists && node.type === 'directory';
            }

            mkdir(path) {
                const { parent, name, exists } = this.resolve(path);
                if (!parent || parent.type !== 'directory' || exists) return false;
                parent.children[name] = { type: 'directory', children: {} };
                this.save(); return true;
            }

            touch(path) {
                const { parent, name, exists } = this.resolve(path);
                if (!parent || parent.type !== 'directory') return false;
                if (exists) return true;
                parent.children[name] = { type: 'file', content: '' };
                this.save(); return true;
            }

            write(path, content) {
                const { parent, name, exists } = this.resolve(path);
                if (!parent || parent.type !== 'directory') return false;
                if (exists && this.get_node(path).type !== 'file') return false;
                const node = exists ? this.get_node(path) : { type: 'file', content: '' };
                node.content = String(content);
                parent.children[name] = node;
                this.save(); return true;
            }

            read(path) {
                const { node, exists } = this.resolve(path);
                return (exists && node.type === 'file') ? node.content : null;
            }

            rm(path) {
                const { parent, name, exists } = this.resolve(path);
                if (!parent || !exists) return false;
                if (parent === this.root && name === 'root') return false;
                if (parent.children && name in parent.children) {
                    delete parent.children[name];
                    this.save(); return true;
                }
                return false;
            }

            rename(path, newName) {
                const { parent, name, exists } = this.resolve(path);
                if (!parent || !exists || !newName || newName === name) return false;
                if (newName in parent.children) return false;
                const node = parent.children[name];
                delete parent.children[name];
                parent.children[newName] = node;
                this.save(); return true;
            }

            copy(src, destDir) {
                const srcRes = this.resolve(src);
                const { node: dirNode, exists } = this.resolve(destDir);
                if (!srcRes.exists || !exists || dirNode.type !== 'directory') return null;
                let name = srcRes.name;
                if (name in dirNode.children) {
                    const dot = name.lastIndexOf('.');
                    const base = dot > 0 ? name.slice(0, dot) : name;
                    const ext = dot > 0 ? name.slice(dot) : '';
                    let i = 1;
                    while ((base + ' copy' + (i > 1 ? ' ' + i : '') + ext) in dirNode.children) i++;
                    name = base + ' copy' + (i > 1 ? ' ' + i : '') + ext;
                }
                dirNode.children[name] = JSON.parse(JSON.stringify(srcRes.node));
                this.save();
                return destDir.replace(/\/+$/, '') + '/' + name;
            }

            move(src, destDir) {
                const srcRes = this.resolve(src);
                if (!srcRes.exists) return null;
                const s = src.replace(/\/+$/, '');
                if (srcRes.node.type === 'directory' && (destDir + '/').indexOf(s + '/') === 0) return null;
                const newPath = this.copy(src, destDir);
                if (!newPath) return null;
                this.rm(src);
                return newPath;
            }

            emptyTrash() {
                const entries = this.list(TRASH_PATH) || [];
                entries.forEach(([name]) => this.rm(TRASH_PATH + '/' + name));
                this.save();
                return entries.length;
            }

            find(name) {
                const results = [];
                const walk = (node, path) => {
                    if (node.children) {
                        Object.keys(node.children).forEach(key => {
                            if (key.toLowerCase().includes(name.toLowerCase())) {
                                results.push({ name: key, path: path + '/' + key, type: node.children[key].type });
                            }
                            walk(node.children[key], path + '/' + key);
                        });
                    }
                };
                walk(this.root, '');
                return results;
            }

            allFiles() {
                const out = [];
                const walk = (node, path) => {
                    if (node.children) {
                        Object.keys(node.children).forEach(key => walk(node.children[key], path + '/' + key));
                    } else if (node.type === 'file') {
                        out.push({ path: path, content: node.content });
                    }
                };
                walk(this.root, '');
                return out;
            }

            treeString(path, prefix) {
                const entries = this.list(path);
                if (!entries) return '';
                let out = '';
                entries.forEach(([name, node]) => {
                    out += (prefix || '') + '├─ ' + (node.type === 'directory' ? name + '/' : name) + '\n';
                    if (node.type === 'directory') out += this.treeString(path + '/' + name, (prefix || '') + '   ');
                });
                return out;
            }

            size() {
                try { return new Blob([JSON.stringify(this.root)]).size; }
                catch (e) { return JSON.stringify(this.root).length; }
            }
        }

        const VFS = new VirtualFilesystem();

        // ============================================================
        // 4. State
        // ============================================================
        const State = {
            windows: [],
            currentTheme: 'dark',
            activeWindow: null
        };

        // ============================================================
        // 5. Settings (theme / wallpaper / accent / prefs)
        // ============================================================
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
        }

        function setAccent(color) {
            const root = document.documentElement.style;
            root.setProperty('--accent-color', color);
            root.setProperty('--accent-color-dim', hexToRgba(color, 0.3));
            localStorage.setItem('droid_os_accent', color);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('droid_os_theme', theme);
            State.currentTheme = theme;
        }

        function applyWallpaper(w) {
            const d = document.getElementById('desktop');
            if (d) d.setAttribute('data-wallpaper', w);
            localStorage.setItem('droid_os_wallpaper', w);
        }

        function applyPrefs(prefs) {
            document.documentElement.classList.toggle('reduce-motion', !!prefs.reduceMotion);
            localStorage.setItem('droid_os_prefs', JSON.stringify(prefs));
        }

        function loadPrefs() {
            try { return JSON.parse(localStorage.getItem('droid_os_prefs') || '{}') || {}; }
            catch (e) { return {}; }
        }

        // ============================================================
        // 6. Notifications
        // ============================================================
        function notify(title, body, type) {
            const container = document.getElementById('notification-center');
            if (!container) return;
            const icons = { info: Icons.bell, ok: Icons.bell, warn: Icons.info, err: Icons.info };
            const n = document.createElement('div');
            n.className = 'notification' + (type ? ' ' + type : '');
            n.innerHTML = `
                ${icons[type] || icons.info}
                <div class="notification-main">
                    <div class="notification-header">
                        <span class="notification-title">${escapeHtml(title)}</span>
                        <button class="notification-close">×</button>
                    </div>
                    <div class="notification-body">${escapeHtml(body)}</div>
                </div>`;
            const dismiss = () => { n.classList.add('removing'); setTimeout(() => n.remove(), 320); };
            n.querySelector('.notification-close').addEventListener('click', dismiss);
            container.prepend(n);
            setTimeout(dismiss, 6000);
        }

        // ============================================================
        // 7. Context menus
        // ============================================================
        function showContextMenu(items, x, y) {
            hideContextMenu();
            const menu = document.createElement('div');
            menu.className = 'context-menu';
            items.forEach(it => {
                if (it.sep) {
                    const d = document.createElement('div');
                    d.className = 'context-sep';
                    menu.appendChild(d);
                    return;
                }
                const el = document.createElement('div');
                el.className = 'context-item' + (it.disabled ? ' disabled' : '');
                el.innerHTML = (it.icon || '') + '<span>' + escapeHtml(it.label) + '</span>';
                el.addEventListener('click', () => { hideContextMenu(); if (it.action) it.action(); });
                menu.appendChild(el);
            });
            document.body.appendChild(menu);
            const mw = menu.offsetWidth, mh = menu.offsetHeight;
            menu.style.left = Math.max(4, Math.min(x, window.innerWidth - mw - 8)) + 'px';
            menu.style.top = Math.max(4, Math.min(y, window.innerHeight - mh - 8)) + 'px';
        }

        function hideContextMenu() {
            document.querySelectorAll('.context-menu').forEach(m => m.remove());
        }

        // ============================================================
        // 8. Window manager
        // ============================================================
        class WindowManagerClass {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.maxZ = 100;
                this.activeId = null;
                this._activeEl = null;
                this._drag = null;
                this._bindGlobalMouse();
            }

            _bindGlobalMouse() {
                window.addEventListener('mousemove', (e) => {
                    const d = this._drag;
                    if (!d) return;
                    if (d.mode === 'move') {
                        const maxLeft = window.innerWidth - 80;
                        const maxTop = window.innerHeight - 96;
                        d.win.style.left = Math.min(Math.max(d.initialX + (e.clientX - d.startX), -(d.win.offsetWidth - 80)), maxLeft) + 'px';
                        d.win.style.top = Math.min(Math.max(d.initialY + (e.clientY - d.startY), 0), maxTop) + 'px';
                    } else if (d.mode === 'resize') {
                        d.win.style.width = Math.max(320, d.sw + (e.clientX - d.startX)) + 'px';
                        d.win.style.height = Math.max(240, d.sh + (e.clientY - d.startY)) + 'px';
                    }
                });
                window.addEventListener('mouseup', () => { this._drag = null; });
            }

            create(appId, title, initialPos) {
                const id = 'win-' + Math.random().toString(36).substr(2, 9);
                const app = AppRegistry[appId];
                if (!app) return null;
                const n = State.windows.length;
                const pos = initialPos || { x: 80 + (n % 8) * 36, y: 60 + (n % 8) * 36, w: 520, h: 400 };
                const win = document.createElement('div');
                win.id = id;
                win.className = 'window';
                win.dataset.appKey = appId;
                win.style.left = pos.x + 'px';
                win.style.top = pos.y + 'px';
                win.style.width = pos.w + 'px';
                win.style.height = pos.h + 'px';
                win.style.zIndex = this.maxZ++;

                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title">${title}</div>
                        <div class="window-controls">
                            <button class="window-control control-min" onclick="WindowManager.minimize('${id}')" title="Minimize"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="rgba(0,0,0,0.55)" stroke-width="1.3" fill="none"/></svg></button>
                            <button class="window-control control-max" onclick="WindowManager.maximize('${id}')" title="Maximize"><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.1"/></svg></button>
                            <button class="window-control control-close" onclick="WindowManager.close('${id}')" title="Close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="rgba(0,0,0,0.55)" stroke-width="1.3" fill="none"/></svg></button>
                        </div>
                    </div>
                    <div class="window-content">
                        <div class="app-content">${app.render ? app.render(id) : ''}</div>
                    </div>
                    <div class="resize-handle"></div>`;

                this.container.appendChild(win);
                this._setupInteractions(win);
                this._setupResize(win);
                State.windows.push({ id, appId, title });
                this._focus(win);
                if (app.init) app.init(win, id);
                return id;
            }

            _setupInteractions(win) {
                const header = win.querySelector('.window-header');
                header.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.window-control')) return;
                    if (this._isMaximized(win)) this._unmaximize(win);
                    this._drag = { mode: 'move', win, startX: e.clientX, startY: e.clientY, initialX: win.offsetLeft, initialY: win.offsetTop };
                    this._focus(win);
                });
                header.addEventListener('dblclick', () => this.maximize(win.id));
                win.addEventListener('mousedown', () => this._focus(win));
            }

            _setupResize(win) {
                const handle = win.querySelector('.resize-handle');
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (this._isMaximized(win)) return;
                    this._drag = { mode: 'resize', win, startX: e.clientX, startY: e.clientY, sw: win.offsetWidth, sh: win.offsetHeight };
                });
            }

            _focus(win) {
                this.maxZ++;
                win.style.zIndex = this.maxZ;
                this.activeId = win.id;
                this._activeEl = win;
                State.activeWindow = win.id;
                document.querySelectorAll('.window').forEach(w => w.classList.toggle('active', w.id === win.id));
                this._updateTaskbar();
            }

            getActive() { return this._activeEl; }

            _isMaximized(win) { return win.dataset.maximized === '1'; }

            _unmaximize(win) {
                win.style.left = win.dataset.origL || '80px';
                win.style.top = win.dataset.origT || '60px';
                win.style.width = win.dataset.origW || '520px';
                win.style.height = win.dataset.origH || '400px';
                delete win.dataset.maximized;
            }

            close(id) {
                const win = document.getElementById(id);
                if (!win) return;
                if (win._stopMonitor) win._stopMonitor();
                win.remove();
                State.windows = State.windows.filter(w => w.id !== id);
                if (this.activeId === id) { this.activeId = null; this._activeEl = null; }
                this._updateTaskbar();
            }

            minimize(id) {
                const win = document.getElementById(id);
                if (!win) return;
                win.dataset.minimized = '1';
                win.style.display = 'none';
                if (this.activeId === id) this.activeId = null;
                this._updateTaskbar();
            }

            restore(id) {
                const win = document.getElementById(id);
                if (!win) return;
                delete win.dataset.minimized;
                win.style.display = 'flex';
                this._focus(win);
            }

            toggleFromTaskbar(id) {
                const win = document.getElementById(id);
                if (!win) return;
                if (win.dataset.minimized === '1') this.restore(id);
                else if (this.activeId === id) this.minimize(id);
                else this._focus(win);
            }

            maximize(id) {
                const win = document.getElementById(id);
                if (!win) return;
                if (this._isMaximized(win)) {
                    this._unmaximize(win);
                } else {
                    win.dataset.origW = win.style.width;
                    win.dataset.origH = win.style.height;
                    win.dataset.origT = win.style.top;
                    win.dataset.origL = win.style.left;
                    win.dataset.maximized = '1';
                    win.style.left = '0'; win.style.top = '0';
                    win.style.width = '100%'; win.style.height = '100%';
                }
                this._focus(win);
            }

            _updateTaskbar() {
                const bar = document.getElementById('running-apps');
                if (!bar) return;
                bar.innerHTML = '';
                State.windows.forEach(w => {
                    const app = AppRegistry[w.appId];
                    if (!app) return;
                    const el = document.getElementById(w.id);
                    const btn = document.createElement('div');
                    btn.className = 'taskbar-app' + (w.id === this.activeId && el && !el.dataset.minimized ? ' active' : '');
                    btn.id = 'tb-' + w.id;

                    btn.addEventListener('click', () => this.toggleFromTaskbar(w.id));
                    bar.appendChild(btn);

        // ============================================================
        // 9. Helpers

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function formatUptime() {
            const s = Math.floor((Date.now() - BOOT_TIME) / 1000);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            return (h ? h + 'h ' : '') + (m ? m + 'm ' : '') + sec + 's';
        }

        function memoryInfo() {
            if (performance.memory) return formatBytes(performance.memory.usedJSHeapSize) + ' / ' + formatBytes(performance.memory.jsHeapSizeLimit);
            return '≈ ' + (navigator.deviceMemory || 8) + ' GB';
        }

        function parentOf(path) {
            return path.replace(/\/[^/]*$/, '') || '/';

        // ============================================================
        // 10. Calculator (pure logic - testable)
        // ============================================================
        function calcInit() {
            return { display: '0', acc: null, op: null, fresh: true, expr: '' };
        }

        function calcCompute(a, op, b) {
            const x = parseFloat(a), y = parseFloat(b);
            if (op === '+') return x + y;
            if (op === '-') return x - y;
            if (op === '×') return x * y;
            if (op === '÷') return y === 0 ? null : x / y;
            return null;
        }

        function calcTrim(n) { return String(parseFloat(n.toPrecision(12))); }

        function calcPress(key, s) {
            s = Object.assign({}, s);
            if (key === 'C') return calcInit();
            if (key === '⌫') {
                if (s.fresh) return s;
                s.display = s.display.length > 1 ? s.display.slice(0, -1) : '0';
                return s;
            }
            if (key === '±') {
                if (s.display !== '0' && s.display !== 'Error') s.display = s.display.startsWith('-') ? s.display.slice(1) : '-' + s.display;
                return s;
            }
            if (key === '%') {
                if (s.display !== 'Error') s.display = calcTrim(parseFloat(s.display) / 100);
                return s;
            }
            if (key === '.') {
                if (s.fresh) { s.display = '0.'; s.fresh = false; return s; }
                if (s.display !== 'Error' && !s.display.includes('.')) s.display += '.';
                return s;
            }
            if (/^[0-9]$/.test(key)) {
                if (s.fresh) { s.display = key; s.fresh = false; }
                else if (s.display === '0') s.display = key;
                else if (s.display === 'Error') { s.display = key; s.fresh = false; }
                else if (s.display.length < 15) s.display += key;
                return s;
            }
            if ('+-×÷'.includes(key)) {
                if (s.acc !== null && !s.fresh && s.op) {
                    const r = calcCompute(s.acc, s.op, s.display);
                    if (r === null || !isFinite(r)) return Object.assign(calcInit(), { display: 'Error', fresh: true });
                    s.acc = r; s.expr = calcTrim(r); s.display = calcTrim(r);
                } else {
                    s.expr = s.display;
                    s.acc = parseFloat(s.display);
                }
                s.op = key;
                s.fresh = true;
                return s;
            }
            if (key === '=') {
                if (s.acc !== null && s.op) {
                    const b = s.fresh ? s.acc : parseFloat(s.display);
                    s.expr = calcTrim(s.acc) + ' ' + s.op + ' ' + calcTrim(b) + ' =';
                    const r = calcCompute(s.acc, s.op, b);
                    if (r === null || !isFinite(r)) return Object.assign(calcInit(), { display: 'Error', fresh: true });
                    s.display = calcTrim(r);
                    s.acc = null; s.op = null; s.fresh = true;
                }
                return s;
            }
            return s;
        }

            if (node.type === 'directory') return { icon: Icons.folder, cls: 'icon-folder' };

                            const meta = node.type === 'directory' ? '<span class="file-meta">—</span>' : '<span class="file-meta">' + (node.content || '').length + ' B</span>';

                            if (renameTarget && renameTarget.path === cwd + '/' + name) {
                                const input = document.createElement('input');
                                input.className = 'rename-input';
                                input.value = name;
                                item.innerHTML = fi.icon + meta;
                                item.insertBefore(input, item.querySelector('.file-meta'));
                                input.focus();
                                input.select();
                                const commit = () => {
                                    const target = renameTarget;
                                    const val = input.value.trim();
                                    renameTarget = null;
                                    if (!target) return;
                                    if (val && val !== target.name) {
                                        const ok = VFS.rename(target.path, val);
                                        if (!ok) notify('Files', 'Could not rename — name may already exist', 'err');
                                    }
                                    render();
                                };
                                const cancel = () => { renameTarget = null; render(); };
                                input.addEventListener('keydown', (e) => {
                                    if (e.key === 'Enter') commit();
                                    if (e.key === 'Escape') cancel();
                                });
                                input.addEventListener('blur', commit);
                            } else {
                                item.innerHTML = fi.icon + '<span class="file-name">' + escapeHtml(name) + '</span>' + meta;
                                item.addEventListener('click', (e) => {
                                    const path = cwd + '/' + name;
                                    if (e.metaKey || e.ctrlKey) {
                                        if (selection.has(path)) selection.delete(path);
                                        else selection.add(path);
                                    } else {
                                        selection.clear();
                                        selection.add(path);
                                    }
                                    render();
                                });
                                item.addEventListener('dblclick', () => openEntry(name, node));
                                item.addEventListener('contextmenu', (e) => {
                                    e.preventDefault();
                                    const path = cwd + '/' + name;
                                    if (!selection.has(path)) { selection.clear(); selection.add(path); }
                                    render();
                                    showContextMenu(buildItemMenu(name, node, path), e.clientX, e.clientY);
                                });
                            }
                            main.appendChild(item);
                        });

                        const count = entries.length;
                        statusEl.innerHTML = '<span>' + count + ' item' + (count === 1 ? '' : 's') + '</span>' +
                            '<span>' + (selection.size ? selection.size + ' selected' : '') +
                            (clipboard ? ' · clipboard: ' + clipboard.paths.length : '') + '</span>';

                        backBtn.disabled = backStack.length === 0;
                        fwdBtn.disabled = fwdStack.length === 0;
                        upBtn.disabled = cwd === '/';
                    };

                    const navigate = (path) => {
                        if (!VFS.isDir(path) || path === cwd) return;
                        backStack.push(cwd);
                        fwdStack.length = 0;
                        cwd = path;
                        selection.clear();
                        renameTarget = null;
                        render();
                    };

                    const openEntry = (name, node) => {
                        const path = cwd + '/' + name;
                        if (node.type === 'directory') { navigate(path); return; }
                        const dot = name.lastIndexOf('.');
                        const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
                        if (ext === 'app') {
                            const content = String(node.content || '');
                            const key = content.startsWith('APP:') ? content.slice(4).trim() : null;
                            if (key && AppRegistry[key]) launchApp(key);
                            else notify('Files', 'Cannot launch ' + name, 'err');
                        } else if (['txt', 'md', 'log', 'sys', 'js', 'json', 'py', 'html', 'css'].includes(ext)) {
                            openFileInEditor(path);
                        } else if (['svg', 'png', 'jpg', 'jpeg', 'gif'].includes(ext)) {
                            launchApp('viewer', { path: path });
                        } else {
                            notify('Files', 'No application can open ' + name, 'warn');
                        }
                    };

                    const buildItemMenu = (name, node, path) => {
                        const isDir = node.type === 'directory';
                        const menu = [
                            { label: 'Open', icon: isDir ? Icons.folder : Icons.file, action: () => openEntry(name, node) },
                            { label: 'Rename', icon: Icons.fileTxt, action: () => { renameTarget = { path: path, name: name }; render(); } }
                        ];
                        if (selection.size > 0) {
                            menu.push({ sep: true },
                                { label: 'Copy', icon: Icons.documents, action: () => { clipboard = { mode: 'copy', paths: Array.from(selection) }; render(); } },
                                { label: 'Cut', icon: Icons.file, action: () => { clipboard = { mode: 'cut', paths: Array.from(selection) }; render(); } },
                                { label: 'Delete', icon: Icons.trash, action: () => deleteSelection() });
                        }
                        menu.push({ sep: true }, { label: 'Properties', icon: Icons.info, action: () => showProperties(path) });
                        return menu;
                    };

                    const deleteSelection = () => {
                        const paths = Array.from(selection);
                        if (paths.length === 0) return;
                        paths.forEach(p => {
                            const inTrash = parentOf(p) === TRASH_PATH;
                            if (inTrash) { VFS.rm(p); notify('Trash', baseName(p) + ' deleted permanently', 'ok'); }
                            else { VFS.move(p, TRASH_PATH); notify('Files', baseName(p) + ' moved to Trash', 'ok'); }
                        });
                        selection.clear();
                        render();
                    };

                    const showProperties = (path) => {
                        const node = VFS.get_node(path);
                        if (!node) return;
                        const dlg = document.createElement('div');
                        dlg.className = 'editor-dialog';
                        const type = node.type === 'directory' ? 'Folder' : 'File';
                        const size = node.type === 'directory' ? '—' : (node.content || '').length + ' B';
                        dlg.innerHTML = `
                            <div class="dialog-box">
                                <div class="dialog-title">${escapeHtml(baseName(path))}</div>
                                <div class="dialog-row"><span class="k">Type</span><span class="v">${type}</span></div>
                                <div class="dialog-row"><span class="k">Location</span><span class="v">${escapeHtml(parentOf(path))}</span></div>
                                <div class="dialog-row"><span class="k">Size</span><span class="v">${size}</span></div>
                                <div class="dialog-actions" style="margin-top:10px;">
                                    <button class="btn btn-primary" id="prop-close">Close</button>
                                </div>
                            </div>`;
                        win.appendChild(dlg);
                        dlg.querySelector('#prop-close').addEventListener('click', () => dlg.remove());
                        dlg.addEventListener('mousedown', (e) => { if (e.target === dlg) dlg.remove(); });
                    };

                    // toolbar
                    backBtn.addEventListener('click', () => {
                        if (backStack.length) { fwdStack.push(cwd); cwd = backStack.pop(); selection.clear(); render(); }
                    });
                    fwdBtn.addEventListener('click', () => {
                        if (fwdStack.length) { backStack.push(cwd); cwd = fwdStack.pop(); selection.clear(); render(); }
                    });
                    upBtn.addEventListener('click', () => {
                        if (cwd !== '/') navigate(parentOf(cwd));
                    });
                    searchInput.addEventListener('input', () => { query = searchInput.value; render(); });

                    win.querySelector('#' + id + '-newfolder').addEventListener('click', () => {
                        const name = prompt('Folder name:');
                        if (name) {
                            if (VFS.mkdir(cwd + '/' + name.trim())) { notify('Files', 'Folder "' + name.trim() + '" created', 'ok'); render(); }
                            else notify('Files', 'Could not create folder', 'err');
                        }
                    });
                    win.querySelector('#' + id + '-newfile').addEventListener('click', () => {
                        const name = prompt('File name (include extension):');
                        if (name) {
                            if (VFS.touch(cwd + '/' + name.trim())) { notify('Files', 'File "' + name.trim() + '" created', 'ok'); render(); }
                            else notify('Files', 'Could not create file', 'err');
                        }
                    });

                    // empty-area context menu
                    main.addEventListener('contextmenu', (e) => {
                        if (e.target.closest('.file-item')) return;
                        e.preventDefault();
                        const items = [
                            { label: 'New Folder', icon: Icons.folder, action: () => win.querySelector('#' + id + '-newfolder').click() },
                            { label: 'New File', icon: Icons.file, action: () => win.querySelector('#' + id + '-newfile').click() },
                            { sep: true }
                        ];
                        items.push({ label: 'Paste', icon: Icons.documents, disabled: !clipboard, action: () => paste() });
                        items.push({ sep: true },
                            { label: 'Select All', icon: Icons.apps, action: () => { (VFS.list(cwd) || []).forEach(([name]) => selection.add(cwd + '/' + name)); render(); } },
                            { label: 'Refresh', icon: Icons.restart, action: () => render() });
                        showContextMenu(items, e.clientX, e.clientY);
                    });

                    // clipboard ops
                    const paste = () => {
                        if (!clipboard || clipboard.paths.length === 0) return;
                        let n = 0;
                        clipboard.paths.forEach(p => {
                            if (clipboard.mode === 'cut' && parentOf(p) === cwd) return;
                            const ok = clipboard.mode === 'cut' ? VFS.move(p, cwd) : VFS.copy(p, cwd);
                            if (ok) n++;
                        });
                        if (clipboard.mode === 'cut') clipboard = null;
                        if (n > 0) notify('Files', 'Pasted ' + n + ' item' + (n > 1 ? 's' : ''), 'ok');
                        render();
                    };
                    const copySel = () => {
                        if (selection.size === 0) { notify('Files', 'Nothing selected', 'warn'); return; }
                        clipboard = { mode: 'copy', paths: Array.from(selection) };
                        notify('Files', 'Copied ' + selection.size + ' item' + (selection.size > 1 ? 's' : ''), 'ok');
                        render();
                    };
                    const cutSel = () => {
                        if (selection.size === 0) { notify('Files', 'Nothing selected', 'warn'); return; }
                        clipboard = { mode: 'cut', paths: Array.from(selection) };
                        notify('Files', 'Cut ' + selection.size + ' item' + (selection.size > 1 ? 's' : ''), 'ok');
                        render();
                    };

                    win._fileOps = {
                        copy: copySel,
                        cut: cutSel,
                        paste: paste,
                        selectAll: () => { (VFS.list(cwd) || []).forEach(([name]) => selection.add(cwd + '/' + name)); render(); },
                        deleteSelection: deleteSelection,
                        focusSearch: () => searchInput.focus()
                    };

                    render();
                }
            },

                                <div class="dialog-title">Save as</div>
                                <input class="dialog-input" id="${id}-savename" value="Untitled.txt" spellcheck="false">

                                    <button class="btn" id="${id}-savecancel">Cancel</button>

                                </div>
                            </div>
                        </div>
                    </div>`,
                init: (win, id) => {
                    const area = win.querySelector('#' + id + '-area');
                    const fname = win.querySelector('#' + id + '-fname');
                    let currentFile = null;
                    let dirty = false;

                    const setDirty = (d) => {
                        dirty = d;
                        fname.textContent = (d ? '● ' : '') + (currentFile ? baseName(currentFile) : 'untitled.txt');
                        fname.classList.toggle('dirty', d);
                    };
                    const setFile = (path) => {
                        currentFile = path;
                        setDirty(false);
                    };
                    const loadFile = (path) => {
                        const content = VFS.read(path);
                        if (content === null) return false;
                        area.value = content;
                        setFile(path);
                        return true;
                    };

                    if (pendingOpenPath && loadFile(pendingOpenPath)) pendingOpenPath = null;

                    area.addEventListener('input', () => { if (!dirty) setDirty(true); });

                    const doSave = () => {
                        if (currentFile) {
                            if (VFS.write(currentFile, area.value)) {
                                setDirty(false);
                                notify('Editor', 'Saved ' + baseName(currentFile), 'ok');
                            } else {
                                notify('Editor', 'Could not save — the file may have been deleted', 'err');
                            }
                        } else {
                            win.querySelector('#' + id + '-savedialog').classList.remove('hidden');
                            win.querySelector('#' + id + '-savename').focus();
                        }
                    };

                    win.querySelector('#' + id + '-new').addEventListener('click', () => {
                        area.value = '';
                        currentFile = null;
                        setDirty(false);
                        fname.textContent = 'untitled.txt';
                    });
                    win.querySelector('#' + id + '-open').addEventListener('click', () => {
                        const files = VFS.allFiles();
                        const select = win.querySelector('#' + id + '-openselect');
                        select.innerHTML = '';
                        if (files.length === 0) select.innerHTML = '<option disabled>No files found</option>';
                        files.forEach(f => {
                            const opt = document.createElement('option');
                            opt.value = f.path;
                            opt.textContent = f.path;
                            select.appendChild(opt);
                        });
                        win.querySelector('#' + id + '-opendialog').classList.remove('hidden');
                    });
                    win.querySelector('#' + id + '-opencancel').addEventListener('click', () => {
                        win.querySelector('#' + id + '-opendialog').classList.add('hidden');
                    });
                    win.querySelector('#' + id + '-openok').addEventListener('click', () => {
                        const select = win.querySelector('#' + id + '-openselect');
                        if (select.value && loadFile(select.value)) notify('Editor', 'Opened ' + baseName(select.value), 'ok');
                        win.querySelector('#' + id + '-opendialog').classList.add('hidden');
                    });
                    win.querySelector('#' + id + '-save').addEventListener('click', doSave);
                    win.querySelector('#' + id + '-saveas').addEventListener('click', () => {
                        win.querySelector('#' + id + '-savedialog').classList.remove('hidden');
                        win.querySelector('#' + id + '-savename').value = currentFile ? baseName(currentFile) : 'Untitled.txt';
                        win.querySelector('#' + id + '-savename').focus();
                    });
                    win.querySelector('#' + id + '-savecancel').addEventListener('click', () => {
                        win.querySelector('#' + id + '-savedialog').classList.add('hidden');
                    });
                    win.querySelector('#' + id + '-saveok').addEventListener('click', () => {
                        let name = win.querySelector('#' + id + '-savename').value.trim() || 'Untitled.txt';
                        if (!name.includes('.')) name += '.txt';
                        const path = '/Documents/' + name;
                        if (VFS.write(path, area.value)) {
                            setFile(path);
                            win.querySelector('#' + id + '-savedialog').classList.add('hidden');
                            notify('Editor', 'Saved ' + name, 'ok');
                        } else {
                            notify('Editor', 'Could not save ' + name, 'err');
                        }
                    });

                    win._saveHandler = doSave;
                    setTimeout(() => area.focus(), 50);
                }
            },
